<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071a46" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://barberiasaas.com/" />
    <title>Barbería SaaS | Agenda inteligente para tu negocio</title>
    <meta name="description" content="Gestioná tus citas, clientes, profesionales y servicios desde un solo lugar. Ideal para barberías, salones de belleza, uñas y más. ¡Probá Barbería SaaS gratis!" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_CR" />
    <meta property="og:site_name" content="Barbería SaaS" />
    <meta property="og:title" content="Barbería SaaS | Tu negocio, tus citas, todo en orden" />
    <meta property="og:description" content="Tu agenda online 24/7 para barberías, salones, uñas y más. Administrá citas, clientes y profesionales fácilmente. ¡Probala gratis!" />
    <meta property="og:url" content="https://barberiasaas.com/" />
    <meta property="og:image" content="https://barberiasaas.com/share-card.svg" />
    <meta property="og:image:alt" content="Barbería SaaS: agenda inteligente para tu negocio" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Barbería SaaS | Agenda inteligente" />
    <meta name="twitter:description" content="Reservas 24/7, clientes, servicios y profesionales en una sola app." />
    <meta name="twitter:image" content="https://barberiasaas.com/share-card.svg" />
    <script>
      // Brand browser chrome before React initializes. Booking pages keep their own tenant branding.
      (function () {
        var host = window.location.hostname.toLowerCase();
        if (host !== "miagendacr.app" && host !== "www.miagendacr.app") return;

        document.title = "Mi Agenda CR | Tu negocio, tus citas, todo en orden";
        var icon = document.querySelector('link[rel="icon"]');
        if (icon) icon.setAttribute("href", "/favicon-miagendacr.svg");
        var theme = document.querySelector('meta[name="theme-color"]');
        if (theme) theme.setAttribute("content", "#A34D78");
        var description = document.querySelector('meta[name="description"]');
        if (description) description.setAttribute("content",
          "Mi Agenda CR: organizá citas, clientes, profesionales y servicios en un solo lugar.");
        var canonical = document.querySelector('link[rel="canonical"]');
        if (canonical) canonical.setAttribute("href", "https://www.miagendacr.app/");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
