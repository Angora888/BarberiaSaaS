name: Validate pull request

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Restore API dependencies
        run: dotnet restore BarberiaSaaS.Api/BarberiaSaaS.csproj

      - name: Build API
        run: dotnet build BarberiaSaaS.Api/BarberiaSaaS.csproj --configuration Release --no-restore

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: BarberiaSaaS.Web/package-lock.json

      - name: Install frontend dependencies
        working-directory: BarberiaSaaS.Web
        run: npm ci

      - name: Build frontend
        working-directory: BarberiaSaaS.Web
        run: npm run build
